# ==============================================================================
# Nginx Reverse Proxy Configuration for Nacencomm Invoice Management
# Domain: invoice.nanis.vn
# Path on Server: /etc/nginx/sites-available/invoice.nanis.vn
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name invoice.nanis.vn;

    # Tùy chọn: Tăng dung lượng tối đa file tải lên nếu gửi XML/File lớn
    client_max_body_size 20M;

    # Cấu hình Reverse Proxy cho ASP.NET Core Web App (Kestrel running on port 5000)
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        
        # Header hỗ trợ WebSocket / HTTP persistent connections
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'keep-alive';
        
        # Forward thông tin client & host thực tế
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts cho các tác vụ xử lý hóa đơn / ký hàng loạt
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Bỏ comment nếu muốn chặn các file ẩn hoặc hệ thống (.git, .env...)
    location ~ /\. {
        deny all;
    }

    # Ghi log riêng cho domain này (tùy chọn)
    access_log /var/log/nginx/invoice.nanis.vn.access.log;
    error_log /var/log/nginx/invoice.nanis.vn.error.log;
}
